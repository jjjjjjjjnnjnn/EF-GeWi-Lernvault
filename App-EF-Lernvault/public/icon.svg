<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Paper base with delicate border -->
    <rect id="squircle" x="16" y="16" width="480" height="480" rx="108" fill="#FAFAF7" stroke="#E5E1D8" stroke-width="6"/>
  </defs>

  <!-- Background Squircle -->
  <use href="#squircle" />

  <g transform="translate(0, 8)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Arch (Vault / Gewölbe) -->
    <path
      d="M 136 348 V 244 A 120 120 0 0 1 376 244 V 348"
      stroke="#1C1B17"
      stroke-width="14"
    />

    <!-- Inner Arch Vault Hairline -->
    <path
      d="M 164 348 V 248 A 92 92 0 0 1 348 248 V 348"
      stroke="#E5E1D8"
      stroke-width="8"
    />

    <!-- Keystone / Schlussstein at the apex of the Vault -->
    <polygon
      points="242,126 270,126 276,148 236,148"
      fill="#1C1B17"
      stroke="#1C1B17"
      stroke-width="4"
    />

    <!-- Base Arch Pedestals -->
    <line x1="122" y1="348" x2="178" y2="348" stroke="#1C1B17" stroke-width="12" />
    <line x1="334" y1="348" x2="390" y2="348" stroke="#1C1B17" stroke-width="12" />

    <!-- Open Book / Folio Base -->
    <!-- Left Leaf -->
    <path
      d="M 256 324 C 216 320 180 334 168 340 V 212 C 180 206 216 194 256 198 Z"
      fill="#FFFFFF"
      stroke="#1C1B17"
      stroke-width="13"
    />

    <!-- Right Leaf -->
    <path
      d="M 256 324 C 296 320 332 334 344 340 V 212 C 332 206 296 194 256 198 Z"
      fill="#FFFFFF"
      stroke="#1C1B17"
      stroke-width="13"
    />

    <!-- Bookmark Ribbon (Accent Indigo #4338CA) -->
    <!-- Hanging gracefully from the center spine -->
    <path
      d="M 250 196 V 344 L 260 334 L 270 344 V 196 Z"
      fill="#4338CA"
      stroke="#4338CA"
      stroke-width="2"
    />

    <!-- Spine Center Line -->
    <line x1="256" y1="196" x2="256" y2="328" stroke="#1C1B17" stroke-width="8" />

    <!-- Plinth / Foundation Baseline -->
    <line x1="130" y1="376" x2="382" y2="376" stroke="#1C1B17" stroke-width="12" />
  </g>
</svg>
